<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FactWise · Invoice to Payment</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter','ui-sans-serif','system-ui'],
            display: ['Instrument Sans','Inter','sans-serif'],
            mono: ['JetBrains Mono','monospace'],
          },
          colors: {
            brand: '#3666ff',
            ink: '#0D1117',
            sub: '#1A1D2E',
            ok: '#00b884',
          },
          boxShadow: {
            'card': '0 1px 3px rgba(15,23,42,0.04)',
            'card-lg': '0 20px 60px -12px rgba(15,23,42,0.12)',
            'glow': '0 12px 40px rgba(42,108,255,0.4)',
            'glow-emerald': '0 12px 40px rgba(16,185,129,0.4)',
          },
        }
      }
    }
  </script>

  <style>
    :root{
      --brand:#3666ff;
      --ink:#0D1117;
      --sub:#1A1D2E;
      --ok:#00b884;
      --line:#f1f5f9;
      --font-display:'Instrument Sans','Inter',sans-serif;
      --font-inter:'Inter',sans-serif;
      --font-mono:'JetBrains Mono',monospace;
    }
    html,body{ background:#fff; color:var(--ink); font-family:'Inter',sans-serif; }
    body{ overflow-x:hidden; }
    .font-display{ font-family:var(--font-display); }
    .font-mono{ font-family:var(--font-mono); }

    @keyframes fw-pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes fw-ping  { 0%{transform:scale(1);opacity:.85} 100%{transform:scale(2.6);opacity:0} }
    @keyframes fw-dash  { to { stroke-dashoffset: -16; } }
    @keyframes fw-scanline {
      0%   { transform: translateY(0%);   opacity:0; }
      8%   { opacity:1; }
      92%  { opacity:1; }
      100% { transform: translateY(100%); opacity:0; }
    }
    @keyframes fw-shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    @keyframes fw-orbit {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes fw-flow {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -40; }
    }

    .fw-grid-bg{
      background-image:
        linear-gradient(rgba(120,150,220,0.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(120,150,220,0.04) 1px,transparent 1px);
      background-size:64px 64px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    /* The animated cursor (shared across panels) */
    .fw-cursor{
      position:absolute;
      width:18px; height:18px;
      pointer-events:none;
      z-index:50;
      filter: drop-shadow(0 4px 8px rgba(15,23,42,0.25));
      transition: opacity .25s;
    }
    .fw-cursor::after{
      /* Click ripple */
      content:'';
      position:absolute; left:-3px; top:-3px;
      width:24px; height:24px;
      border-radius:50%;
      border:2px solid #3666ff;
      opacity:0;
      transform:scale(0.4);
    }
    .fw-cursor.fw-click::after{
      animation: fw-ping .6s ease-out 1;
    }

    #__loader{
      position:fixed; inset:0; display:grid; place-items:center;
      background:#fff; z-index:9999;
      font-family:'Inter',sans-serif; color:#94a3b8; font-size:13px;
    }
    #__loader .dot{ width:8px; height:8px; border-radius:50%; background:#3666ff; display:inline-block; margin-right:8px; animation:fw-pulse 1.4s infinite; vertical-align:middle; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
</head>
<body>
  <div id="__loader"><span><span class="dot"></span>Loading FactWise · Invoice to Payment…</span></div>
  <div id="root"></div>

  <script>
    // Debug: capture key warnings with stack traces
    (function(){
      const orig = console.error;
      window.__keyWarnings = [];
      console.error = function(...args){
        if (typeof args[0] === 'string' && args[0].indexOf('unique') !== -1) {
          window.__keyWarnings.push({
            msg: args[0],
            extra: args.slice(1).map(a => typeof a==='string'?a:String(a)),
            stack: new Error().stack,
          });
        }
        orig.apply(console, args);
      };
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "react": "./js/shim-react.js",
        "react-dom": "./js/shim-react-dom.js",
        "react/jsx-runtime": "./js/shim-react-jsx-runtime.js",
        "react/jsx-dev-runtime": "./js/shim-react-jsx-runtime.js"
      }
    }
  </script>

  <script type="module">
    (async () => {
      try {
        const fm = await import('https://esm.sh/framer-motion@11.11.17?external=react,react-dom');
        window.framerMotion = { motion: fm.motion, AnimatePresence: fm.AnimatePresence };

        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js';
          s.integrity = 'sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y';
          s.crossOrigin = 'anonymous';
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });

        const sources = [
          'js/icons.jsx',
          'js/invoice/shared.jsx',
          'js/invoice/anim1.jsx',
          'js/invoice/anim2.jsx',
          'js/invoice/anim3.jsx',
          'js/invoice/anim4.jsx',
          'js/invoice/anim5.jsx',
          'js/invoice/flow.jsx',
          'js/invoice/app.jsx',
        ];
        for (const src of sources) {
          const s = document.createElement('script');
          s.type = 'text/babel';
          s.setAttribute('data-presets','react');
          s.src = src;
          document.body.appendChild(s);
        }

        window.Babel.transformScriptTags();

        const wait = () => {
          const root = document.getElementById('root');
          if (root && root.children.length) {
            document.getElementById('__loader').remove();
          } else {
            setTimeout(wait, 60);
          }
        };
        wait();
      } catch (err) {
        console.error('Bootstrap error', err && err.stack || err && err.message || String(err));
        document.getElementById('__loader').textContent = 'Bootstrap failed: '+ (err && (err.stack || err.message) || String(err));
      }
    })();
  </script>
</body>
</html>
