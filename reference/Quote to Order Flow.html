
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quote to Order Flow — FactWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --fw-blue: #3666ff;
    --fw-blue-deep: #1a3dbb;
    --fw-emerald: #00b884;
    --fw-purple: #7b68ee;
    --fw-amber: #f59e0b;
    --fw-ink: #0b1322;
    --fw-ink-2: #1A1D2E;
  }
  html, body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--fw-ink-2);
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
  }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  /* Hero gradient backdrop (lifted from globals.css pattern, softened) */
  .page-gradient {
    background:
      radial-gradient(circle at 85% 5%,
        rgba(77,124,255,0.18) 0%,
        rgba(122,158,255,0.10) 22%,
        transparent 55%),
      radial-gradient(circle at 5% 60%,
        rgba(0, 184, 132, 0.08) 0%,
        transparent 50%),
      linear-gradient(180deg, #f7faff 0%, #ffffff 30%, #ffffff 70%, #f5f8ff 100%);
  }

  .noise {
    position: absolute; inset: 0; pointer-events: none;
    opacity: 0.04; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/%3E%3C/svg%3E");
  }

  .section-badge-blue   { background:#eff4ff; border:1px solid #d8e2ff; color:#3666ff; }
  .section-badge-emer   { background:#ecfdf5; border:1px solid #bbf2db; color:#00b884; }
  .section-badge-purple { background:#f3f0ff; border:1px solid #ddd5ff; color:#7b68ee; }
  .section-badge-amber  { background:#fef6e7; border:1px solid #fde3ad; color:#b45309; }

  .dashboard-shell {
    background: #ffffff;
    border: 1px solid #e9eef5;
    border-radius: 22px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 30px 60px -28px rgba(15,23,42,0.18);
  }
  .chrome-bar {
    background: #f9fafc;
    border-bottom: 1px solid #eef1f6;
    padding: 10px 14px;
    border-top-left-radius: 22px;
    border-top-right-radius: 22px;
    display: flex; align-items: center; gap: 10px;
  }
  .chrome-dot { width:10px; height:10px; border-radius:50%; }

  /* Soft animated dotted grid behind dashboards */
  .dash-bg {
    background-image: radial-gradient(rgba(15,23,42,0.06) 1px, transparent 1px);
    background-size: 18px 18px;
  }

  /* Fade-in for animation steps */
  .step-enter { animation: stepIn 420ms cubic-bezier(.22,1,.36,1) both; }
  @keyframes stepIn {
    from { opacity:0; transform: translateY(6px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .step-pop { animation: stepPop 380ms cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes stepPop {
    from { opacity:0; transform: scale(0.92); }
    to   { opacity:1; transform: scale(1); }
  }
  .slide-in-right { animation: slideRight 500ms cubic-bezier(.22,1,.36,1) both; }
  @keyframes slideRight {
    from { opacity:0; transform: translateX(14px); }
    to   { opacity:1; transform: translateX(0); }
  }

  /* Number counter shimmer */
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 0 0 0 rgba(54,102,255,0); }
    50%     { box-shadow: 0 0 0 6px rgba(54,102,255,0.10); }
  }
  .pulse-blue { animation: pulseGlow 1.8s ease-in-out infinite; }

  /* Tiny dashed progress */
  @keyframes dashFlow { to { background-position: 24px 0; } }
  .dashed-flow {
    background-image: linear-gradient(90deg, #cbd5e1 50%, transparent 50%);
    background-size: 12px 1.5px;
    background-repeat: repeat-x;
    background-position: 0 50%;
    animation: dashFlow 1.4s linear infinite;
    height: 2px; border-radius: 2px;
  }

  /* Cursor */
  .anim-cursor {
    position:absolute; pointer-events:none; z-index:40;
    width:22px; height:22px;
    filter: drop-shadow(0 2px 6px rgba(15,23,42,0.25));
    transition: transform 700ms cubic-bezier(.22,1,.36,1);
  }
  .anim-cursor.clicking { transform: scale(0.85); }

  /* Stat ticker */
  .tabular { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/anim-bom.jsx"></script>
  <script type="text/babel" src="src/anim-sourcing.jsx"></script>
  <script type="text/babel" src="src/anim-analytics.jsx"></script>
  <script type="text/babel" src="src/anim-quote.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
