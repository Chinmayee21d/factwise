<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C96A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9973A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A87830;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dark navy background with rounded corners -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#0B1628"/>
  <!-- Subtle gold border -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="none" stroke="#C49A3C" stroke-width="0.8" opacity="0.5"/>
  <!-- HR text in italic serif matching reference font -->
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="'Times New Roman', Times, Georgia, serif"
    font-size="17"
    font-weight="bold"
    font-style="italic"
    letter-spacing="0.5"
    fill="url(#goldGrad)"
  >HR</text>
</svg>
